name: Daily Commit for DevSync

on:
  schedule:
    - cron: "30 10 * * *"   # runs once per day at 10:30 UTC

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp file with Supreeth's email (22f3001903@ds.study.iitm.ac.in)
        run: |
          echo "Last updated by GitHub Actions at $(date -u)" > status.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add status.txt
          git commit -m "Daily update: automated by GitHub Actions for DevSync" || echo "No changes to commit"
          git push --allow-empty
